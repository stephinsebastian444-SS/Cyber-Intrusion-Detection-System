<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - CyberShield IDS</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/login.css">

</head>


<body class="auth-page">


<div class="auth-container">

    <div class="auth-card">

        <div class="auth-brand">
            CYBERSHIELD IDS
        </div>


        <h1>Create Account</h1>


        <p class="auth-subtitle">
            Register to access the CyberShield IDS Dashboard.
        </p>


        <form
            id="registerForm"
            class="auth-form"
        >

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p
            id="message"
            class="auth-message"
        ></p>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <div class="auth-security">

            Your password is securely processed by the
            CyberShield IDS backend.

        </div>

    </div>

</div>


<script src="js/api.js"></script>

</body>

</html>
