<h1>Settings</h1>

<p>Configure the Intrusion Detection System</p>

<div class="table-box">

<h2>System Settings</h2>

<form id="settingsForm">

<label>Network Interface</label>

<select id="interface">

<option>Realtek WiFi Adapter</option>

<option>Ethernet</option>

</select>

<br><br>

<label>Alert Sensitivity</label>

<select id="sensitivity">

<option>Low</option>

<option selected>Medium</option>

<option>High</option>

</select>

<br><br>

<label>Refresh Interval (seconds)</label>

<input type="number" id="refresh" value="5">

<br><br>

<button type="submit">
Save Settings
</button>

</form>

<p id="message"></p>
